<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Monochrome Gradients & Filters -->
    <linearGradient id="bwCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>

    <linearGradient id="bwFaint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#52525b" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="bwGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Pitch Black Icon Container -->
  <rect width="512" height="512" rx="128" fill="#000000"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Outer Isometric Hexagonal Ring (Distributed Nodes) -->
  <g transform="translate(256, 256)">
    <!-- Perimeter Track -->
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90"
             fill="none"
             stroke="#3f3f46"
             stroke-width="3"
             stroke-dasharray="6 6"/>

    <!-- Perimeter Worker Nodes -->
    <circle cx="0" cy="-180" r="8" fill="#ffffff" filter="url(#bwGlow)"/>
    <circle cx="156" cy="-90" r="8" fill="#e4e4e7"/>
    <circle cx="156" cy="90" r="8" fill="#a1a1aa"/>
    <circle cx="0" cy="180" r="8" fill="#71717a"/>
    <circle cx="-156" cy="90" r="8" fill="#a1a1aa"/>
    <circle cx="-156" cy="-90" r="8" fill="#e4e4e7"/>

    <!-- Minimalist Isometric Facets -->
    <!-- Top Face -->
    <polygon points="0,-110 95,-55 0,0 -95,-55"
             fill="#ffffff"
             opacity="0.95"/>
    
    <!-- Right Face -->
    <polygon points="0,0 95,-55 95,55 0,110"
             fill="#a1a1aa"
             opacity="0.7"/>

    <!-- Left Face -->
    <polygon points="0,0 0,110 -95,55 -95,-55"
             fill="#3f3f46"
             opacity="0.8"/>

    <!-- Central Micro-Nexus Chip -->
    <rect x="-34" y="-34" width="68" height="68" rx="14"
          transform="rotate(45)"
          fill="#09090b"
          stroke="#ffffff"
          stroke-width="3"/>

    <!-- Core Dot -->
    <circle cx="0" cy="0" r="9" fill="#ffffff"/>

    <!-- Fine Circuit Rays -->
    <line x1="0" y1="-50" x2="0" y2="-180" stroke="#71717a" stroke-width="2" stroke-linecap="round"/>
    <line x1="47" y1="-27" x2="156" y2="-90" stroke="#71717a" stroke-width="2" stroke-linecap="round"/>
    <line x1="47" y1="27" x2="156" y2="90" stroke="#52525b" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="50" x2="0" y2="180" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>
    <line x1="-47" y1="27" x2="-156" y2="90" stroke="#52525b" stroke-width="2" stroke-linecap="round"/>
    <line x1="-47" y1="-27" x2="-156" y2="-90" stroke="#71717a" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
